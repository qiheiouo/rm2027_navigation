chassis_interface_stub:
  ros__parameters:
    # Phase 1 conservative placeholder limits.
    # Final limits must be tuned on the 2027 real chassis.
    limits:
      max_vx: 1.0
      max_vy: 1.0
      max_wz: 2.0
    watchdog_timeout_sec: 0.5
    publish_twist_raw: true
    cmd_vel_topic: /cmd_vel

    # Empty by default. Phase 1.5 simulation sets this to
    # /simulation/chassis/cmd_vel so Gazebo receives the validated, limited,
    # watchdog-protected command instead of bypassing the chassis boundary.
    mock_output_cmd_vel_topic: ""
