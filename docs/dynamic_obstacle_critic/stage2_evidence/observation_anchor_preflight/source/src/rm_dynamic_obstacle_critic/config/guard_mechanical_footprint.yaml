# Frozen-fixture mechanical envelope plus original 0.03m padding; not hardware geometry.
dynamic_safety_guard:
  ros__parameters:
    use_sim_time: false
    input_topic: /dynamic_test/cmd_vel_smoothed
    output_topic: /dynamic_test/cmd_vel_guarded
    obstacles_topic: /perception/dynamic_obstacles_shadow/predictions
    odom_topic: /odometry/lio
    costmap_topic: /local_costmap/costmap_raw
    world_frame: odom
    base_frame: base_link
    footprint:
    - -0.355
    - -0.33
    - -0.355
    - 0.33
    - 0.355
    - 0.33
    - 0.355
    - -0.33
    horizon: 0.5
    simulation_dt: 0.02
    response_delay: 0.1
    linear_deceleration: 1.0
    angular_deceleration: 2.0
    safety_margin: 0.02
    collision_threshold: 203
    command_timeout: 0.15
    odom_timeout: 0.15
    costmap_timeout: 0.5
    max_age: 0.4
    max_observation_age: 0.4
    max_obstacle_speed: 3.0
    max_obstacle_extent: 3.0
    minimum_obstacle_radius: 0.36
    jump_tolerance: 0.5
    vx_min: -0.5
    vx_max: 0.8
    vy_max: 0.5
    wz_max: 1.2
    input_frame: map
    max_tf_age: 0.1
    max_tracks: 64
    frequency: 50.0
    max_simulation_steps: 512
