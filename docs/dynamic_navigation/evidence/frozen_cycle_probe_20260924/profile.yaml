behavior_server:
  ros__parameters:
    backup:
      plugin: nav2_behaviors/BackUp
    behavior_plugins:
    - spin
    - backup
    - drive_on_heading
    - wait
    costmap_topic: local_costmap/costmap_raw
    cycle_frequency: 10.0
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    footprint_topic: local_costmap/published_footprint
    global_frame: odom
    max_rotational_vel: 1.0
    min_rotational_vel: 0.2
    robot_base_frame: base_link
    rotational_acc_lim: 2.0
    simulate_ahead_time: 2.0
    spin:
      plugin: nav2_behaviors/Spin
    transform_tolerance: 0.3
    use_sim_time: false
    wait:
      plugin: nav2_behaviors/Wait
bt_navigator:
  ros__parameters:
    bt_loop_duration: 10
    default_server_timeout: 20
    global_frame: map
    odom_topic: /odometry/lio
    robot_base_frame: base_link
    use_sim_time: false
    wait_for_service_timeout: 1000
controller_server:
  ros__parameters:
    FollowPath:
      ConstraintCritic:
        cost_power: 1
        cost_weight: 4.0
        enabled: true
      CostCritic:
        collision_cost: 1000000.0
        consider_footprint: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        enabled: true
        near_goal_distance: 0.5
      GoalAngleCritic:
        cost_power: 1
        cost_weight: 3.0
        enabled: true
        threshold_to_consider: 0.5
      GoalCritic:
        cost_power: 1
        cost_weight: 5.0
        enabled: true
        threshold_to_consider: 1.4
      PathAlignCritic:
        cost_power: 1
        cost_weight: 10.0
        enabled: true
        max_path_occupancy_ratio: 0.07
        offset_from_furthest: 20
        threshold_to_consider: 0.5
        trajectory_point_step: 4
        use_path_orientations: false
      PathAngleCritic:
        cost_power: 1
        cost_weight: 2.0
        enabled: true
        forward_preference: false
        max_angle_to_furthest: 1.2
        offset_from_furthest: 4
        threshold_to_consider: 0.5
      PathFollowCritic:
        cost_power: 1
        cost_weight: 5.0
        enabled: true
        offset_from_furthest: 6
        threshold_to_consider: 1.4
      batch_size: 300
      critics:
      - ConstraintCritic
      - CostCritic
      - GoalCritic
      - GoalAngleCritic
      - PathAlignCritic
      - PathFollowCritic
      - PathAngleCritic
      - PredictionV1Critic
      gamma: 0.015
      iteration_count: 1
      model_dt: 0.1
      motion_model: Omni
      plugin: nav2_mppi_controller::MPPIController
      prune_distance: 1.5
      regenerate_noises: false
      retry_attempt_limit: 1
      temperature: 0.3
      time_steps: 30
      transform_tolerance: 0.3
      visualize: false
      vx_max: 0.8
      vx_min: -0.5
      vx_std: 0.2
      vy_max: 0.5
      vy_std: 0.2
      wz_max: 1.2
      wz_std: 0.4
      PredictionV1Critic:
        enabled: true
        topic: /perception/dynamic_obstacles_shadow/predictions
        object_width: 0.45
        object_height: 0.55
        reference_acceleration: 0.5551652475612764
        max_age: 0.4
        horizon: 1.0
    controller_frequency: 10.0
    controller_plugins:
    - FollowPath
    failure_tolerance: 0.3
    general_goal_checker:
      plugin: nav2_controller::SimpleGoalChecker
      stateful: true
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.2
    goal_checker_plugins:
    - general_goal_checker
    min_theta_velocity_threshold: 0.001
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    odom_topic: /odometry/lio
    progress_checker:
      movement_time_allowance: 10.0
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
    progress_checker_plugin: progress_checker
    use_sim_time: false
global_costmap:
  global_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[0.2800954544, 0.191], [0.191, 0.2800954544], [-0.191, 0.2800954544],
        [-0.2800954544, 0.191], [-0.2800954544, -0.191], [-0.191, -0.2800954544],
        [0.191, -0.2800954544], [0.2800954544, -0.191]]'
      footprint_padding: 0.03
      global_frame: map
      height: 12
      inflation_layer:
        cost_scaling_factor: 2.0
        inflation_radius: 0.65
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          inf_is_valid: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.1
          raytrace_max_range: 8.0
          raytrace_min_range: 0.1
          topic: /scan
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 2.0
      resolution: 0.05
      robot_base_frame: base_link
      rolling_window: true
      track_unknown_space: false
      update_frequency: 5.0
      use_sim_time: false
      width: 13
local_costmap:
  local_costmap:
    ros__parameters:
      always_send_full_costmap: true
      footprint: '[[0.2800954544, 0.191], [0.191, 0.2800954544], [-0.191, 0.2800954544],
        [-0.2800954544, 0.191], [-0.2800954544, -0.191], [-0.191, -0.2800954544],
        [0.191, -0.2800954544], [0.2800954544, -0.191]]'
      footprint_padding: 0.03
      global_frame: odom
      height: 5
      inflation_layer:
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
        plugin: nav2_costmap_2d::InflationLayer
      obstacle_layer:
        enabled: true
        observation_sources: scan
        plugin: nav2_costmap_2d::ObstacleLayer
        scan:
          clearing: true
          data_type: LaserScan
          inf_is_valid: true
          marking: true
          max_obstacle_height: 2.0
          obstacle_max_range: 7.5
          obstacle_min_range: 0.1
          raytrace_max_range: 8.0
          raytrace_min_range: 0.1
          topic: /scan
      plugins:
      - obstacle_layer
      - inflation_layer
      publish_frequency: 5.0
      resolution: 0.05
      robot_base_frame: base_link
      rolling_window: true
      update_frequency: 10.0
      use_sim_time: false
      width: 5
planner_server:
  ros__parameters:
    GridBased:
      allow_unknown: true
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
    expected_planner_frequency: 5.0
    planner_plugins:
    - GridBased
    use_sim_time: false
smoother_server:
  ros__parameters:
    simple_smoother:
      do_refinement: true
      max_its: 1000
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
    smoother_plugins:
    - simple_smoother
    use_sim_time: false
velocity_smoother:
  ros__parameters:
    deadband_velocity:
    - 0.0
    - 0.0
    - 0.0
    feedback: OPEN_LOOP
    max_accel:
    - 1.0
    - 1.0
    - 2.0
    max_decel:
    - -1.0
    - -1.0
    - -2.0
    max_velocity:
    - 0.8
    - 0.5
    - 1.2
    min_velocity:
    - -0.5
    - -0.5
    - -1.2
    odom_duration: 0.1
    odom_topic: /odometry/lio
    scale_velocities: false
    smoothing_frequency: 20.0
    use_sim_time: false
    velocity_timeout: 1.0
waypoint_follower:
  ros__parameters:
    loop_rate: 20
    stop_on_failure: false
    use_sim_time: false
    wait_at_waypoint:
      enabled: false
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      waypoint_pause_duration: 0
    waypoint_task_executor_plugin: wait_at_waypoint
