# Fragment only. Use tools/make_profile.py with a complete existing Nav2 profile.
# Isolated simulation/offline candidate; no launch selects it by default.
planner_server:
  ros__parameters:
    planner_plugins: [GridBased]
    GridBased:
      plugin: rm_tdt_planner/TdtGlobalPlanner
      optimize: true
      clearance: 0.02
      potential_weight: 0.5
      simplify_tolerance: 0.10
      output_spacing: 0.025
      time_budget: 0.25
      nominal_speed: 1.0
      nominal_acceleration: 1.0
      corridor_range: 1.0
      collision_iterations: 3
      max_waypoints: 32
