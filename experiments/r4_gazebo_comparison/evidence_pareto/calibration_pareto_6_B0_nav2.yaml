      footprint_padding: 0.0
      plugins:
      - stvl_layer
      - inflation_layer
      stvl_layer:
        plugin: spatio_temporal_voxel_layer/SpatioTemporalVoxelLayer
        enabled: true
        voxel_decay: 0.5
        decay_model: 0
        voxel_size: 0.05
        track_unknown_space: false
        observation_persistence: 0.0
        max_obstacle_height: 2.0
        mark_threshold: 1
        update_footprint_enabled: true
        footprint_clearing_enabled: true
        combination_method: 1
        obstacle_range: 3.5
        origin_z: -0.2
        publish_voxel_map: false
        transform_tolerance: 0.3
        mapping_mode: false
        observation_sources: left_mid360_mark left_mid360_clear
        left_mid360_mark:
          topic: /scan
          data_type: LaserScan
          marking: true
          clearing: false
          observation_persistence: 0.2
          expected_update_rate: 0.2
          min_obstacle_height: 0.18
          max_obstacle_height: 2.0
          obstacle_min_range: 0.12
          obstacle_max_range: 3.5
          clear_after_reading: true
          filter: voxel
          voxel_min_points: 1
        left_mid360_clear:
          topic: /scan
          data_type: LaserScan
          marking: false
          clearing: true
          min_z: 0.0
          max_z: 6.0
          horizontal_fov_angle: 6.28318530718
          vertical_fov_angle: 0.1
          vertical_fov_offset: 0.0
          decay_acceleration: 1.0
          model_type: 1
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 6.0
        inflation_radius: 0.55
      always_send_full_costmap: true
