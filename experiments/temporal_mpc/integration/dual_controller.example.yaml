# M3 design example, NOT a complete runnable Nav2 profile. The TemporalMPC
# nav2_core::Controller binary and actual input adapter are not built in M1.
# Merge into a COPY of the validated STVL profile; preserve complete MPPI
# parameter subtree under its new ID. Never load this fragment by itself.
controller_server:
  ros__parameters:
    controller_frequency: 20.0
    odom_topic: /odometry/lio
    controller_plugins: [FollowPathMPPI, FollowPathTemporalMPC]
    FollowPathMPPI:
      plugin: nav2_mppi_controller::MPPIController
      # Full baseline MPPI subtree is required, with same tested limits.
    FollowPathTemporalMPC:
      plugin: rm_temporal_mpc::Controller
      prediction_horizon: 1.5
      model_dt: 0.1
      solver_time_limit: 0.015
      cycle_budget: 0.04
      solver_max_iterations: 400
      max_active_obstacles: 4
