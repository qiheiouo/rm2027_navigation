lio_adapter:
  ros__parameters:
    raw_odom_topic: /odometry/fast_lio_raw
    output_odom_topic: /odometry/lio
    odom_frame: odom
    base_frame: base_link
    input_sensor_frame: lio_imu_link
    gimbal_frame: gimbal_yaw_link
    publish_tf: true
    use_zero_yaw_gimbal_placeholder: true

    # Phase 1 placeholder only.
    # This is NOT the final 2027 real-robot extrinsic.
    # If the backend outputs odom->lio_imu_link or odom->mid360_*_frame,
    # lio_adapter must compute odom->base_link using gimbal yaw and measured
    # sensor extrinsics. Do not fake the conversion by only changing
    # child_frame_id.
    #
    # This placeholder assumes the gimbal yaw is zero and stores an
    # input_sensor_frame -> base_link transform. Real hardware must replace it
    # with a time-aware dynamic gimbal transform.
    input_to_base_placeholder:
      x: 0.0
      y: 0.0
      z: 0.0
      roll: 0.0
      pitch: 0.0
      yaw: 0.0
