gimbal_state_adapter:
  ros__parameters:
    input_topic: /gimbal/state
    output_topic: /joint_states
    joint_name: gimbal_yaw_joint

    # Phase 1 placeholder mode.
    # Real hardware must set use_input=true and feed a timestamped
    # rm_competition_interfaces/GimbalState. Invalid or stale input stops
    # joint-state publication; it never falls back to a fake zero angle.
    use_input: false
    placeholder_yaw_rad: 0.0
    publish_rate_hz: 50.0
    stale_timeout_sec: 0.2
