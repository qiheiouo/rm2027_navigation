lio_adapter:
  ros__parameters:
    raw_odom_topic: /odometry/fast_lio_raw
    output_odom_topic: /odometry/lio
    expected_input_odom_frame: odom
    odom_frame: odom
    base_frame: base_link
    input_sensor_frame: lio_imu_link
    gimbal_frame: gimbal_yaw_link
    publish_tf: true
    use_tf_sensor_to_base: true
    use_latest_transform: false
    allow_placeholder_fallback: false
    # FAST-LIO raw odom uses its initial sensor frame as the parent. Convert
    # both parent and child basis so startup does not inherit MID360 mount rpy.
    raw_odom_parent_frame_mode: sensor_initial
    tf_lookup_timeout_sec: 0.0
    tf_queue:
      max_size: 100
      max_wait_sec: 0.2
      retry_rate_hz: 200.0

    # FAST-LIO Multi backend-private body is treated as the old-car sensor
    # frame, then transformed through TF into base_link. It is never aliased
    # directly to base_link.
    backend_child_frame_alias_enabled: true
    backend_child_frame_alias_source: body
    backend_child_frame_alias_target: lio_imu_link

    twist_mode: finite_difference
    twist_estimator:
      min_dt_sec: 0.001
      max_dt_sec: 0.5
      smoothing_alpha: 0.3
      max_linear_speed: 5.0
      max_angular_speed: 20.0

    twist_variance_diagonal: [1.0, 1.0, 1.0, 4.0, 4.0, 4.0]

    # Old-car high-spin evidence showed the backend publishing odometry up to
    # 3.50 s behind sensor time and then jumping about 10 m while catching up.
    # Never expose that stale backlog as canonical odom -> base_link. After a
    # stale/silent interval, require a short fresh sequence near the last
    # accepted translation before reopening the canonical output.
    input_health:
      enabled: true
      max_message_age_sec: 0.20
      max_future_offset_sec: 0.05
      max_silence_sec: 0.20
      recovery_fresh_samples: 5
      recovery_max_translation_m: 0.75
      valid_topic: /localization/lio_runtime_valid
      status_topic: /localization/lio_runtime_status
      backend_calc_time_topic: /lio/diagnostics/calc_time
      backend_point_count_topic: /lio/diagnostics/point_number

    # Inverse of the old-car measured base_link -> lio_imu_link transform.
    # Placeholder fallback remains disabled; this is retained only for explicit
    # emergency experiments.
    input_to_base_placeholder:
      x: -0.100613
      y: 0.094732
      z: -0.256541
      roll: 0.318208
      pitch: -0.303217
      yaw: -1.668838
