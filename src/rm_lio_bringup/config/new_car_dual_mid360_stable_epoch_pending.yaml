# OPT-IN stable raw parent for first_source_sample adapter; default launch remains disabled.
# imu_max_gap_sec=0.1 is a SOFTWARE FIXTURE budget (one configured 10 Hz scan).
# Real MID360 IMU cadence/loss/time synchronization must determine the hardware budget.
# Restart the whole backend AND adapter after clock rollback or acquisition gap.
# EXPERIMENTAL backend-only template. Never a production calibration.
# Copy outside tracked production configuration; fill measured rigid transforms
# (row-major rotations) and record revision. null deliberately rejects startup.
# One left internal IMU, two clouds; right IMU remains diagnostic in driver.
# All filter/noise/update thresholds are inherited unchanged from existing dual.
/**:
  ros__parameters:
    common:
      async_debug: false
      multi_lidar: true
      imu_max_gap_sec: 0.1
      publish_tf_results: false
      max_iteration: 3
      map_frame: odom
      lid_topic: /livox/left/lidar
      lid_topic2: /livox/right/lidar
      imu_topic: /livox/lio_imu
    method:
      voxelized_pt_num_thres: 1000
      effect_pt_num_ratio_thres: 0.4
      bundle_enabled_tic_thres: 10
    preprocess:
      filter_size_surf: 0.5
      point_filter_num: 3
      point_filter_num2: 3
      lidar_type: 1
      lidar_type2: 1
      scan_line: 4
      scan_line2: 4
      scan_rate: 10
      scan_rate2: 10
      timestamp_unit: 3
      timestamp_unit2: 3
      blind: 1.0
      blind2: 1.0
    mapping:
      zero_start_pose: false
      zero_start_delay_scans: 40
      cube_side_length: 1000.0
      acc_cov: 0.15
      gyr_cov: 0.15
      b_acc_cov: 0.0002
      b_gyr_cov: 0.0002
      det_range: 100.0
      extrinsic_est_en: false
      extrinsic_imu_to_lidars: true
      extrinsic_T: null
      extrinsic_R: null
      extrinsic_T2: null
      extrinsic_R2: null
      extrinsic_T_L2_wrt_L1: null
      extrinsic_R_L2_wrt_L1: null
      extrinsic_T_L1_wrt_drone: null
      extrinsic_R_L1_wrt_drone: null
    publish:
      path_en: false
      scan_publish_en: false
      dense_publish_en: false
      scan_bodyframe_pub_en: false
    pcd_save:
      pcd_save_en: false
      interval: -1
