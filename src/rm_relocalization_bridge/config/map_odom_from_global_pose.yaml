map_odom_from_global_pose:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    global_pose_topic: /localization/global_pose
    upstream_valid_topic: ""
    odom_topic: /odometry/lio
    map_to_odom_topic: /localization/map_to_odom
    publish_tf: true
    publish_rate_hz: 20.0
    odom_cache_size: 500
    max_pose_odom_dt_sec: 0.05
    max_global_pose_age_sec: 0.5
    pending_pose_max_wait_sec: 0.2
    pending_pose_max_size: 20
    # Compatibility default: robot-specific launches may opt into correction gating.
    correction_innovation_gate_enabled: false
    max_correction_translation_step_m: 0.35
    max_correction_yaw_step_rad: 0.35
    initial_pose_topic: /initialpose
    autonomous_recovery_enabled: false
    recovery_linear_speed_threshold_mps: 0.08
    recovery_angular_speed_threshold_radps: 0.15
    recovery_motion_confirmation_sec: 0.12
    recovery_stationary_hold_sec: 0.6
    recovery_reseed_cooldown_sec: 2.0
    recovery_settle_sec: 0.5
    recovery_required_consistent_poses: 5
    recovery_initial_pose_xy_variance: 0.09
    recovery_initial_pose_yaw_variance: 0.0685
    # Compatibility defaults: robot-specific profiles may opt into bounded
    # pose-window stationarity and odometry-divergence rebasing.
    recovery_pose_stationarity_enabled: false
    recovery_pose_stationarity_window_sec: 1.0
    recovery_pose_stationarity_max_translation_m: 0.20
    recovery_pose_stationarity_max_yaw_rad: 0.25
    recovery_max_reseed_attempts: 0
    recovery_odom_divergence_rebase_enabled: false
    recovery_odom_divergence_translation_m: 1.0
    recovery_rebase_initial_pose_xy_variance: 0.36
    recovery_rebase_initial_pose_yaw_variance: 0.2742
    recovery_rebase_pose_translation_tolerance_m: 0.75
    recovery_rebase_pose_yaw_tolerance_rad: 0.75
    recovery_rebase_required_consistent_poses: 10
    recovery_state_topic: /localization/correction_recovery_state
