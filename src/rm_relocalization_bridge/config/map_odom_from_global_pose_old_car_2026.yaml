map_odom_from_global_pose:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    global_pose_topic: /localization/global_pose
    upstream_valid_topic: ""
    odom_topic: /odometry/lio
    map_to_odom_topic: /localization/map_to_odom
    publish_tf: true
    publish_rate_hz: 20.0
    odom_cache_size: 500
    max_pose_odom_dt_sec: 0.05
    max_global_pose_age_sec: 0.5
    pending_pose_max_wait_sec: 0.2
    pending_pose_max_size: 20

    # Old-car fail-safe for the observed high-spin AMCL failure. The raw pose
    # can be confidently wrong, so covariance gating alone is insufficient.
    correction_innovation_gate_enabled: true
    max_correction_translation_step_m: 0.35
    max_correction_yaw_step_rad: 0.35
    initial_pose_topic: /initialpose

    # Competition recovery: once a jump is rejected, keep canonical TF invalid,
    # wait until LIO reports the chassis stationary, then reseed AMCL around the
    # last trusted map correction. Restore TF only after consecutive agreement.
    autonomous_recovery_enabled: true
    recovery_linear_speed_threshold_mps: 0.08
    recovery_angular_speed_threshold_radps: 0.15
    # lio_adapter derives twist by finite difference. Ignore isolated rest-noise
    # spikes, but treat an over-threshold run lasting 0.12 s as real motion.
    recovery_motion_confirmation_sec: 0.12
    recovery_stationary_hold_sec: 0.6
    recovery_reseed_cooldown_sec: 2.0
    recovery_settle_sec: 0.5
    recovery_required_consistent_poses: 5
    recovery_initial_pose_xy_variance: 0.09
    recovery_initial_pose_yaw_variance: 0.0685
    recovery_state_topic: /localization/correction_recovery_state
