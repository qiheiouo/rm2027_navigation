map_odom_from_global_pose:
  ros__parameters:
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    global_pose_topic: /localization/global_pose
    upstream_valid_topic: ""
    # A fresh/valid global-pose backend is necessary but not sufficient. When
    # the old-car LIO adapter rejects stale backlog, withhold map->odom until
    # canonical odometry has reopened its own health gate.
    odometry_valid_topic: /localization/lio_runtime_valid
    odom_topic: /odometry/lio
    map_to_odom_topic: /localization/map_to_odom
    publish_tf: true
    publish_rate_hz: 20.0
    odom_cache_size: 500
    max_pose_odom_dt_sec: 0.05
    max_global_pose_age_sec: 0.5
    pending_pose_max_wait_sec: 0.2
    pending_pose_max_size: 20

    # Old-car fail-safe for the observed high-spin AMCL failure. The raw pose
    # can be confidently wrong, so covariance gating alone is insufficient.
    correction_innovation_gate_enabled: true
    max_correction_translation_step_m: 0.35
    max_correction_yaw_step_rad: 0.35
    initial_pose_topic: /initialpose

    # Competition recovery: once a jump is rejected, keep canonical TF invalid,
    # wait until LIO reports the chassis stationary, then reseed AMCL around the
    # last trusted map correction. Restore TF only after consecutive agreement.
    autonomous_recovery_enabled: true
    recovery_linear_speed_threshold_mps: 0.08
    recovery_angular_speed_threshold_radps: 0.15
    # lio_adapter derives twist by finite difference. Ignore isolated rest-noise
    # spikes, but treat an over-threshold run lasting 0.12 s as real motion.
    recovery_motion_confirmation_sec: 0.12
    recovery_stationary_hold_sec: 0.6
    # Give AMCL time to converge before another reset. The 2 s field setting
    # produced a 16-reseed / 33.88 s recovery tail.
    recovery_reseed_cooldown_sec: 5.0
    recovery_settle_sec: 0.5
    recovery_required_consistent_poses: 5
    recovery_initial_pose_xy_variance: 0.09
    recovery_initial_pose_yaw_variance: 0.0685

    # The finite-difference twist contains repeated rest spikes. Use a bounded
    # pose window to confirm that odometry has actually settled before reseed.
    recovery_pose_stationarity_enabled: true
    recovery_pose_stationarity_window_sec: 1.0
    recovery_pose_stationarity_max_translation_m: 0.20
    recovery_pose_stationarity_max_yaw_rad: 0.25
    recovery_max_reseed_attempts: 6

    # Old-car-only fail-closed fallback for the 2026-09-01 high-spin bag. If
    # the trusted correction applied to current LIO is over 1 m from the last
    # trusted global robot pose, do not seed AMCL in that displaced region.
    # Preserve trusted XY, use the settled LIO-predicted yaw, then accept a new
    # map->odom baseline only after absolute-pose and correction consistency.
    recovery_odom_divergence_rebase_enabled: true
    recovery_odom_divergence_translation_m: 1.0
    recovery_rebase_initial_pose_xy_variance: 0.36
    recovery_rebase_initial_pose_yaw_variance: 0.2742
    recovery_rebase_pose_translation_tolerance_m: 0.75
    recovery_rebase_pose_yaw_tolerance_rad: 0.75
    recovery_rebase_required_consistent_poses: 10
    recovery_state_topic: /localization/correction_recovery_state
