amcl:
  ros__parameters:
    use_sim_time: false
    alpha1: 0.2
    alpha2: 0.2
    alpha3: 0.2
    alpha4: 0.2
    alpha5: 0.2
    base_frame_id: base_link
    global_frame_id: map
    odom_frame_id: odom
    scan_topic: /localization/scan
    map_topic: /map
    robot_model_type: nav2_amcl::OmniMotionModel
    laser_model_type: likelihood_field_prob
    laser_likelihood_max_dist: 2.0
    laser_min_range: -1.0
    laser_max_range: -1.0
    max_beams: 90
    min_particles: 500
    max_particles: 2000
    pf_err: 0.05
    pf_z: 0.99
    resample_interval: 1
    recovery_alpha_fast: 0.0
    recovery_alpha_slow: 0.0
    do_beamskip: true
    beam_skip_distance: 0.5
    beam_skip_threshold: 0.3
    beam_skip_error_threshold: 0.9
    sigma_hit: 0.2
    z_hit: 0.5
    z_rand: 0.5
    z_max: 0.05
    z_short: 0.05
    lambda_short: 0.1
    transform_tolerance: 0.2
    update_min_d: 0.05
    update_min_a: 0.05
    set_initial_pose: false
    always_reset_initial_pose: true
    first_map_only: false
    save_pose_rate: 0.0
    tf_broadcast: false

amcl_pose_gate:
  ros__parameters:
    use_sim_time: false
    input_topic: /localization/amcl_pose_raw
    output_topic: /localization/global_pose
    valid_topic: /localization/amcl_backend_valid
    map_frame: map
    max_pose_age_sec: 0.5
    max_future_sec: 0.1
    max_xy_variance: 1.0
    max_yaw_variance: 0.5
    max_abs_z: 0.25
    max_abs_roll_pitch: 0.15
    validity_timeout_sec: 1.0
