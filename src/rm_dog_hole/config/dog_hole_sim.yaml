dog_hole_manager:
  ros__parameters:
    use_sim_time: true

    map_frame: map
    base_frame: base_link
    navigate_action: /navigate_to_pose
    compute_path_action: /compute_path_to_pose
    command_topic: /cmd_vel_nav

    # This launch is an explicit dog-hole task. Keep the raw path_crosses
    # diagnostic, but do not let an unconstrained global planner bypass the
    # tunnel through the open simulation world.
    task.require_traversal: true

    # User-supplied August 2026 placeholders: 0.80 m width, 0.25 m height,
    # and approximately 0.30 m depth. Replace the depth after field/CAD freeze.
    dog_hole.center_x: -3.0
    dog_hole.center_y: 0.0
    dog_hole.yaw: 3.141592653589793
    dog_hole.width: 0.80
    dog_hole.length: 0.30
    dog_hole.wall_height: 0.45
    dog_hole.wall_thickness: 0.10
    dog_hole.roof_clearance: 0.25
    dog_hole.entry_clearance: 0.80
    dog_hole.exit_clearance: 0.50

    # Optional terrain parameters. Zero keeps the first controller comparison
    # planar; 11/15 degree profiles can be enabled without changing code.
    dog_hole.deck_height: 0.0
    dog_hole.entry_slope_deg: 0.0
    dog_hole.exit_slope_deg: 0.0

    # The plan view is interpreted as a symmetric 45-degree chamfered octagon:
    # four 0.382 m straight edges alternating with four 0.126 m chamfers.
    # This derives a 0.5601909 m axis-aligned bounding box. These parameters
    # remain placeholders until final CAD is available.
    robot.length: 0.5601909089
    robot.width: 0.5601909089
    robot.footprint: [
      0.2800954544, 0.191,
      0.191, 0.2800954544,
      -0.191, 0.2800954544,
      -0.2800954544, 0.191,
      -0.2800954544, -0.191,
      -0.191, -0.2800954544,
      0.191, -0.2800954544,
      0.2800954544, -0.191
    ]

    # Transformation is a launch-time collision profile for now. It does not
    # send a lower-controller flag or pretend that the mechanism is finalized.
    robot.geometry_profile: deformed
    robot.height: 0.22
    robot.deformed_height: 0.22
    robot.undeformed_height: 0.32
    robot.gimbal_joint_height: 0.115
    robot.gimbal_radius: 0.20
    robot.gimbal_thickness: 0.04
    robot.sim_lidar_offset_x: 0.12
    robot.sim_lidar_offset_y: 0.0
    robot.deformed_lidar_offset_z: 0.065
    robot.undeformed_lidar_offset_z: 0.175
    robot.sim_lidar_size_x: 0.08
    robot.sim_lidar_size_y: 0.08
    robot.sim_lidar_size_z: 0.06

    # Simulation-only localization disturbance. These remain zero in the
    # nominal profile and never affect real localization launches.
    simulation.localization.lateral_noise_std_m: 0.0
    simulation.localization.yaw_noise_std_rad: 0.0
    simulation.localization.delay_sec: 0.0
    simulation.localization.lateral_drift_amplitude_m: 0.0
    simulation.localization.yaw_drift_amplitude_rad: 0.0
    simulation.localization.drift_frequency_hz: 0.0
    simulation.localization.random_seed: 20270728
    # Deliberately nonzero: heading fusion must use lower-controller yaw
    # deltas and must not assume its world zero is aligned with ROS odom.
    simulation.localization.heading_world_offset_rad: 1.10
    # Nominal run is exactly synchronized. Override this in explicit timing
    # robustness tests; the adapter accepts at most 30 ms.
    simulation.localization.heading_timestamp_offset_sec: 0.0

    # Simulation-only execution response. Unit scales and zero time constants
    # preserve the nominal Gazebo command path.
    simulation.chassis.forward_scale: 1.0
    simulation.chassis.lateral_positive_scale: 1.0
    simulation.chassis.lateral_negative_scale: 1.0
    simulation.chassis.angular_scale: 1.0
    simulation.chassis.lateral_time_constant_sec: 0.0
    simulation.chassis.angular_time_constant_sec: 0.0

    approach_offset: 0.15
    final_goal: [-5.0, 0.0, 3.141592653589793]
    auto_start: true
    auto_start_delay_sec: 8.0

    control.rate_hz: 30.0
    control.forward_speed: 0.35
    control.lateral_gain: 1.8
    control.heading_gain: 2.5
    control.max_lateral_speed: 0.20
    control.max_angular_speed: 0.80
    # Required base-forward direction is not yet known. Zero means the chassis
    # x-axis follows the corridor; tune this offset once the mechanism is fixed.
    control.traversal_yaw_offset: 0.0
    control.minimum_clearance: 0.03
    control.maximum_heading_error: 0.40
    # Nav2 stops at the open preparation point. The dedicated controller then
    # rotates the base, centers it, and advances to the tunnel entrance.
    control.alignment_forward_speed: 0.25
    # The controller automatically raises approach_offset when needed so the
    # complete footprint stays before the configured entry ramp while aligning.
    control.alignment_margin: 0.05
    control.alignment_longitudinal_gain: 1.0
    control.alignment_longitudinal_tolerance: 0.05
    control.alignment_lateral_tolerance: 0.04
    control.alignment_heading_tolerance: 0.10
    control.alignment_timeout_sec: 15.0
    control.crossing_timeout_sec: 12.0

    log_csv: /tmp/rm2027_dog_hole_sim/dog_hole_run.csv
