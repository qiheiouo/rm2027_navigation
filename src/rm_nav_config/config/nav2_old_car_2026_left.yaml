# 2026 old-car experiment profile for real MID360 PointCloud2 input.
# This is not a 2027 competition tuning file. It keeps the canonical Nav2/MPPI
# boundary but consumes the left MID360 PointCloud2 topic directly so old-car
# dry-run validation can prove that real lidar data reaches the costmaps.

bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: map
    robot_base_frame: base_link
    odom_topic: /odometry/lio
    bt_loop_duration: 10
    default_server_timeout: 20
    wait_for_service_timeout: 1000

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: progress_checker
    goal_checker_plugins: [general_goal_checker]
    controller_plugins: [FollowPath]

    progress_checker:
      plugin: nav2_controller::SimpleProgressChecker
      required_movement_radius: 0.05
      movement_time_allowance: 10.0

    general_goal_checker:
      stateful: true
      plugin: nav2_controller::SimpleGoalChecker
      xy_goal_tolerance: 0.15
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: nav2_mppi_controller::MPPIController
      motion_model: Omni
      model_dt: 0.1
      time_steps: 30
      batch_size: 300
      iteration_count: 1
      # Old-car real serial transport clamps to these values before writing
      # /dev/ttyACM0. Keep Nav2 aligned so controller prediction matches the
      # off-ground/first-floor motion envelope.
      vx_std: 0.08
      vy_std: 0.08
      wz_std: 0.16
      vx_max: 0.15
      vx_min: -0.15
      vy_max: 0.15
      wz_max: 0.30
      temperature: 0.3
      gamma: 0.015
      retry_attempt_limit: 1
      regenerate_noises: false
      visualize: false
      prune_distance: 1.5
      transform_tolerance: 0.3
      critics: [ConstraintCritic, CostCritic, GoalCritic, GoalAngleCritic, PathAlignCritic, PathFollowCritic, PathAngleCritic]

      ConstraintCritic:
        enabled: true
        cost_power: 1
        cost_weight: 4.0
      CostCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.81
        critical_cost: 300.0
        collision_cost: 1000000.0
        consider_footprint: true
        near_goal_distance: 0.5
      GoalCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        threshold_to_consider: 1.4
      GoalAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 3.0
        threshold_to_consider: 0.5
      PathAlignCritic:
        enabled: true
        cost_power: 1
        cost_weight: 10.0
        threshold_to_consider: 0.5
        offset_from_furthest: 20
        trajectory_point_step: 4
        max_path_occupancy_ratio: 0.07
        use_path_orientations: false
      PathFollowCritic:
        enabled: true
        cost_power: 1
        cost_weight: 5.0
        offset_from_furthest: 6
        threshold_to_consider: 1.4
      PathAngleCritic:
        enabled: true
        cost_power: 1
        cost_weight: 2.0
        offset_from_furthest: 4
        threshold_to_consider: 0.5
        max_angle_to_furthest: 1.2
        forward_preference: false

planner_server:
  ros__parameters:
    use_sim_time: false
    expected_planner_frequency: 5.0
    planner_plugins: [GridBased]
    GridBased:
      plugin: nav2_navfn_planner/NavfnPlanner
      tolerance: 0.5
      use_astar: false
      allow_unknown: true

smoother_server:
  ros__parameters:
    use_sim_time: false
    smoother_plugins: [simple_smoother]
    simple_smoother:
      plugin: nav2_smoother::SimpleSmoother
      tolerance: 1.0e-10
      max_its: 1000
      do_refinement: true

behavior_server:
  ros__parameters:
    use_sim_time: false
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: [spin, backup, drive_on_heading, wait]
    spin:
      plugin: nav2_behaviors/Spin
    backup:
      plugin: nav2_behaviors/BackUp
    drive_on_heading:
      plugin: nav2_behaviors/DriveOnHeading
    wait:
      plugin: nav2_behaviors/Wait
    global_frame: odom
    robot_base_frame: base_link
    transform_tolerance: 0.3
    simulate_ahead_time: 2.0
    max_rotational_vel: 0.30
    min_rotational_vel: 0.05
    rotational_acc_lim: 0.60

waypoint_follower:
  ros__parameters:
    use_sim_time: false
    loop_rate: 20
    stop_on_failure: false
    waypoint_task_executor_plugin: wait_at_waypoint
    wait_at_waypoint:
      plugin: nav2_waypoint_follower::WaitAtWaypoint
      enabled: false
      waypoint_pause_duration: 0

velocity_smoother:
  ros__parameters:
    use_sim_time: false
    smoothing_frequency: 20.0
    scale_velocities: false
    feedback: OPEN_LOOP
    max_velocity: [0.15, 0.15, 0.30]
    min_velocity: [-0.15, -0.15, -0.30]
    max_accel: [0.25, 0.25, 0.60]
    max_decel: [-0.25, -0.25, -0.60]
    odom_topic: /odometry/lio
    odom_duration: 0.1
    deadband_velocity: [0.0, 0.0, 0.0]
    velocity_timeout: 1.0

local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 5.0
      global_frame: odom
      robot_base_frame: base_link
      rolling_window: true
      # The old-car MID360 sits near the edge of the local rolling window in
      # some poses. Use a wider experiment-only window before floor tests.
      width: 8
      height: 8
      resolution: 0.05
      footprint: "[[-0.30, -0.25], [-0.30, 0.25], [0.30, 0.25], [0.30, -0.25]]"
      footprint_padding: 0.03
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        # Real MID360 point clouds run on wall time and the old-car mounting is
        # approximate. Keep a generous vertical voxel span for first hardware
        # tests so the sensor origin and upward returns stay inside bounds.
        # Nav2's voxel grid supports at most 16 z values, so 0.15 * 16 covers
        # about -0.2 m to 2.2 m without triggering voxel_grid warnings.
        origin_z: -0.2
        z_resolution: 0.15
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: cloud
        cloud:
          topic: /livox/left/pointcloud
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_min_range: 0.10
          obstacle_max_range: 8.0
          raytrace_min_range: 0.10
          raytrace_max_range: 8.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 3.0
        inflation_radius: 0.45
      always_send_full_costmap: true

global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 5.0
      publish_frequency: 2.0
      global_frame: map
      robot_base_frame: base_link
      rolling_window: true
      width: 16
      height: 16
      resolution: 0.05
      track_unknown_space: false
      footprint: "[[-0.30, -0.25], [-0.30, 0.25], [0.30, 0.25], [0.30, -0.25]]"
      footprint_padding: 0.03
      plugins: [voxel_layer, inflation_layer]
      voxel_layer:
        plugin: nav2_costmap_2d::VoxelLayer
        enabled: true
        publish_voxel_map: true
        origin_z: -0.2
        z_resolution: 0.15
        z_voxels: 16
        max_obstacle_height: 2.0
        mark_threshold: 0
        observation_sources: cloud
        cloud:
          topic: /livox/left/pointcloud
          data_type: PointCloud2
          clearing: true
          marking: true
          min_obstacle_height: 0.05
          max_obstacle_height: 2.0
          obstacle_min_range: 0.10
          obstacle_max_range: 8.0
          raytrace_min_range: 0.10
          raytrace_max_range: 8.0
      inflation_layer:
        plugin: nav2_costmap_2d::InflationLayer
        cost_scaling_factor: 2.0
        inflation_radius: 0.65
      always_send_full_costmap: true
