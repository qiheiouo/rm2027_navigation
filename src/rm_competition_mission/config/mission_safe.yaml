competition_mission_node:
  ros__parameters:
    startup_enabled: false
    default_mode: hold
    map_frame: map
    navigate_action: /navigate_to_pose
    tick_rate_hz: 10.0
    require_localization_valid: true
    require_referee_state: true
    require_game_running: true
    require_chassis_mode: true
    allow_pursuit: false
    game_running_value: 4
    retreat_hp_threshold: 150
    goal_update_distance: 0.35
    goal_update_yaw: 0.35
    minimum_goal_update_sec: 0.5
    goal_failure_retry_sec: 2.0
    max_consecutive_goal_failures: 3
    # Optional until map-frame poses are reviewed in RViz:
    # home_pose: [0.0, 0.0, 0.0]
    # patrol_waypoints: [1.0, 0.0, 0.0, 1.0, 1.0, 1.57]
