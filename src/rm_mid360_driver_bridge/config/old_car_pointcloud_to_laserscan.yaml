old_car_left_pointcloud_to_laserscan:
  ros__parameters:
    input_topic: /livox/left/pointcloud_filtered
    output_topic: /local_scan
    target_frame: base_link

    # Full horizontal projection for the MID360 local obstacle view.
    # Empty bins are published as +inf so Nav2 ObstacleLayer can raytrace free
    # space when inf_is_valid is enabled.
    angle_min: -3.141592653589793
    angle_max: 3.141592653589793
    angle_increment: 0.01
    scan_time: 0.066

    # Keep this aligned with the old-car local costmap obstacle/raytrace
    # ranges. range_min also preserves the already validated near-field blind
    # area around the chassis.
    range_min: 0.45
    range_max: 6.0

    # Mirror the local costmap obstacle height gate. This keeps ground and
    # low chassis noise out before the 2D scan loses z information.
    min_height: 0.18
    max_height: 2.0

    transform_timeout_sec: 0.05
