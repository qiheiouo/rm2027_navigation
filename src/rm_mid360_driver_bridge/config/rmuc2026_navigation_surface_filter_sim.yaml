ramp_laserscan_filter_node:
  ros__parameters:
    use_sim_time: true
    input_topic: /simulation/scan_ramp_unfiltered
    output_topic: /scan
    diagnostic_topic: /diagnostics
    map_frame: map
    filter_enabled: true
    shadow_only: false
    transform_timeout_sec: 0.10

    # Simulation-only contract for rmuc2026_navigation_field.sdf. These values
    # must never be reused for a real map bundle.
    expected_map_id: official_rmuc2026_navigation
    expected_map_revision: rules_v2_2_navigation_v1
    active_map_id: official_rmuc2026_navigation
    active_map_revision: rules_v2_2_navigation_v1

    # The large zero-slope region removes the artificial ground line produced
    # when the planar Gazebo lidar pitches with the chassis. Vertical obstacle
    # faces remain because their return height is above the surface tolerance.
    region_names: [
      field_ground,
      central_west_10_5,
      central_deck,
      central_east_10_5,
      red_road_15,
      red_road_deck,
      red_road_11,
      blue_road_11,
      blue_road_deck,
      blue_road_15
    ]

    regions.field_ground.polygon_xy: [
      -14.0, -7.5,
      14.0, -7.5,
      14.0, 7.5,
      -14.0, 7.5
    ]
    regions.field_ground.origin_xyz: [0.0, 0.0, 0.0]
    regions.field_ground.ascent_yaw_deg: 0.0
    regions.field_ground.slope_deg: 0.0
    regions.field_ground.surface_tolerance: 0.045

    regions.central_west_10_5.polygon_xy: [
      -3.892, -3.0,
      -2.0, -3.0,
      -2.0, 3.0,
      -3.892, 3.0
    ]
    regions.central_west_10_5.origin_xyz: [-3.892, 0.0, 0.0]
    regions.central_west_10_5.ascent_yaw_deg: 0.0
    regions.central_west_10_5.slope_deg: 10.5
    regions.central_west_10_5.surface_tolerance: 0.045

    regions.central_deck.polygon_xy: [
      -2.0, -3.0,
      2.0, -3.0,
      2.0, 3.0,
      -2.0, 3.0
    ]
    regions.central_deck.origin_xyz: [0.0, 0.0, 0.35]
    regions.central_deck.ascent_yaw_deg: 0.0
    regions.central_deck.slope_deg: 0.0
    regions.central_deck.surface_tolerance: 0.045

    regions.central_east_10_5.polygon_xy: [
      2.0, -3.0,
      3.892, -3.0,
      3.892, 3.0,
      2.0, 3.0
    ]
    regions.central_east_10_5.origin_xyz: [3.892, 0.0, 0.0]
    regions.central_east_10_5.ascent_yaw_deg: 180.0
    regions.central_east_10_5.slope_deg: 10.5
    regions.central_east_10_5.surface_tolerance: 0.045

    regions.red_road_15.polygon_xy: [
      -6.620, -6.4,
      -5.5, -6.4,
      -5.5, -4.6,
      -6.620, -4.6
    ]
    regions.red_road_15.origin_xyz: [-6.620, -5.5, 0.0]
    regions.red_road_15.ascent_yaw_deg: 0.0
    regions.red_road_15.slope_deg: 15.0
    regions.red_road_15.surface_tolerance: 0.045

    regions.red_road_deck.polygon_xy: [
      -5.5, -6.4,
      -0.5, -6.4,
      -0.5, -4.6,
      -5.5, -4.6
    ]
    regions.red_road_deck.origin_xyz: [-3.0, -5.5, 0.30]
    regions.red_road_deck.ascent_yaw_deg: 0.0
    regions.red_road_deck.slope_deg: 0.0
    regions.red_road_deck.surface_tolerance: 0.045

    regions.red_road_11.polygon_xy: [
      -0.5, -6.4,
      1.043, -6.4,
      1.043, -4.6,
      -0.5, -4.6
    ]
    regions.red_road_11.origin_xyz: [1.043, -5.5, 0.0]
    regions.red_road_11.ascent_yaw_deg: 180.0
    regions.red_road_11.slope_deg: 11.0
    regions.red_road_11.surface_tolerance: 0.045

    regions.blue_road_11.polygon_xy: [
      -1.043, 4.6,
      0.5, 4.6,
      0.5, 6.4,
      -1.043, 6.4
    ]
    regions.blue_road_11.origin_xyz: [-1.043, 5.5, 0.0]
    regions.blue_road_11.ascent_yaw_deg: 0.0
    regions.blue_road_11.slope_deg: 11.0
    regions.blue_road_11.surface_tolerance: 0.045

    regions.blue_road_deck.polygon_xy: [
      0.5, 4.6,
      5.5, 4.6,
      5.5, 6.4,
      0.5, 6.4
    ]
    regions.blue_road_deck.origin_xyz: [3.0, 5.5, 0.30]
    regions.blue_road_deck.ascent_yaw_deg: 0.0
    regions.blue_road_deck.slope_deg: 0.0
    regions.blue_road_deck.surface_tolerance: 0.045

    regions.blue_road_15.polygon_xy: [
      5.5, 4.6,
      6.620, 4.6,
      6.620, 6.4,
      5.5, 6.4
    ]
    regions.blue_road_15.origin_xyz: [6.620, 5.5, 0.0]
    regions.blue_road_15.ascent_yaw_deg: 180.0
    regions.blue_road_15.slope_deg: 15.0
    regions.blue_road_15.surface_tolerance: 0.045
